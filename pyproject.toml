[project]
name = "patch-code-agent"
version = "0.1.0"
description = "A test-driven coding agent harness built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
patch-code-agent = "patch_code_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
